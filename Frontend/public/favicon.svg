<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="fav-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="fav-sapphire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#4338ca" />
      <stop offset="80%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="fav-diag" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="fav-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="fav-specular" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#a5f3fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fav-tile-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="fav-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00f2fe" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="4" y="4" width="92" height="92" rx="26" ry="26" fill="#070b1c" stroke="url(#fav-tile-border)" stroke-width="1.8" />
  <rect x="5" y="5" width="90" height="90" rx="25" ry="25" fill="url(#fav-glass)" />

  <!-- 3D Folded Ribbon 'N' -->
  <g filter="url(#fav-shadow)">
    <path d="M 24 74 C 24 81 28 85 34 85 C 40 85 44 80 44 73 L 44 42 C 44 32 37 25 28 27 C 24 28 22 32 22 37 Z" fill="url(#fav-sapphire)" opacity="0.9" />
    <path d="M 23 72 L 23 35 C 23 27 28 21 36 21 C 41 21 44 24 45 28 L 45 68 C 45 76 39 82 32 82 C 26 82 23 78 23 72 Z" fill="url(#fav-cyan)" />
    <path d="M 24 70 L 24 35 C 24 28 28 23 35 22" stroke="url(#fav-specular)" stroke-width="2" stroke-linecap="round" />

    <path d="M 33 22 C 37 20 42 22 46 27 L 76 72 C 80 77 78 83 73 85 C 68 87 63 84 59 79 L 29 34 C 27 30 28 24 33 22 Z" fill="url(#fav-diag)" />
    <path d="M 34 23 L 75 73" stroke="url(#fav-specular)" stroke-width="2.2" stroke-linecap="round" />

    <path d="M 57 32 C 57 26 62 20 69 20 C 76 20 81 25 81 32 L 81 69 C 81 77 75 83 67 83 C 63 83 59 81 57 77 L 57 32 Z" fill="url(#fav-right)" />
    <path d="M 80 68 L 80 32 C 80 26 76 21 70 21" stroke="url(#fav-specular)" stroke-width="2" stroke-linecap="round" />
    <circle cx="72" cy="25" r="2.5" fill="#ffffff" />

    <!-- Center Diamond Glint -->
    <g transform="translate(52, 49)">
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#ffffff" />
      <circle cx="0" cy="0" r="2" fill="#a5f3fc" />
    </g>
  </g>
</svg>
